name: Frontend CI

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest

    env:
      E2E_API_BASE_URL: "${{ secrets.E2E_API_BASE_URL }}"
      E2E_STUDENT_EMAIL: "${{ secrets.E2E_STUDENT_EMAIL }}"
      E2E_STUDENT_PASSWORD: "${{ secrets.E2E_STUDENT_PASSWORD }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Real booking E2E note
        if: ${{ env.E2E_API_BASE_URL == '' }}
        run: echo "Real booking E2E skipped - configure E2E_API_BASE_URL and dedicated test credentials to enable it."
