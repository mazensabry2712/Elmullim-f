name: Build Hostinger Static Site

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_API: https://api.elmullim.com
          VITE_ENV: production
        run: npm run build

      - name: Prepare static deployment
        run: |
          mkdir -p /tmp/hostinger-deploy
          cp -R dist/. /tmp/hostinger-deploy/
          cat > /tmp/hostinger-deploy/.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteBase /

              <IfModule mod_headers.c>
                  <FilesMatch "^index\\.html$">
                      Header set Cache-Control "no-cache, no-store, must-revalidate"
                      Header set Pragma "no-cache"
                      Header set Expires "0"
                  </FilesMatch>
              </IfModule>

              RewriteCond %{REQUEST_FILENAME} -f [OR]
              RewriteCond %{REQUEST_FILENAME} -d
              RewriteRule ^ - [L]

              RewriteRule ^ index.html [L]
          </IfModule>
          EOF

      - name: Publish hostinger branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/hostinger-deploy
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy: build main [skip ci]"
          git branch -M hostinger
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin hostinger
