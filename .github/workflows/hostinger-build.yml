name: Build Hostinger Static Site
# Production deploy source of truth: tested main commit -> generated hostinger branch.
# Only run after the complete Frontend CI workflow succeeds.

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: elmullim-hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the exact tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_API: https://api.elmullim.com
          VITE_ENV: production
        run: npm run build

      - name: Verify production bundle
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -maxdepth 1 -type f -print -quit)"
          echo "Production bundle built from tested commit $GITHUB_SHA"

      - name: Publish only if the tested commit is still main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          CURRENT_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "$CURRENT_MAIN_SHA" != "$TESTED_SHA" ]]; then
            echo "Skipping deployment: tested SHA $TESTED_SHA is no longer the latest main ($CURRENT_MAIN_SHA)."
            exit 0
          fi

          mkdir -p /tmp/hostinger-deploy
          cp -R dist/. /tmp/hostinger-deploy/
          cat > /tmp/hostinger-deploy/.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteBase /

              <IfModule mod_headers.c>
                  <FilesMatch "^index\\.html$">
                      Header set Cache-Control "no-cache, no-store, must-revalidate"
                      Header set Pragma "no-cache"
                      Header set Expires "0"
                  </FilesMatch>
              </IfModule>

              RewriteCond %{REQUEST_FILENAME} -f [OR]
              RewriteCond %{REQUEST_FILENAME} -d
              RewriteRule ^ - [L]

              RewriteRule ^ index.html [L]
          </IfModule>
          EOF

          cd /tmp/hostinger-deploy
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy: build tested main $TESTED_SHA [skip ci]"
          git branch -M hostinger
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin hostinger
